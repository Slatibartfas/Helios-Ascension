# Bevy-optimized build configuration
#
# ─── sccache ────────────────────────────────────────────────────────────
# Cache rustc invocations across branches / CI runs. Install once with
# `cargo install sccache --locked`. The cache lives in ~/.cache/sccache
# (Linux), ~/Library/Caches/sccache (macOS) or
# %LOCALAPPDATA%\Mozilla\sccache (Windows). Set `SCCACHE_DIR` to override.
#
# On CI we additionally point SCCACHE_GHA_ENABLED=1 so sccache uses the
# GitHub Actions cache backend for cross-run reuse.
[build]
rustc-wrapper = "sccache"

# ─── Linker ─────────────────────────────────────────────────────────────
# Use rust-lld (bundled with rustup's `llvm-tools` component) on Windows MSVC.
# The default `link.exe` link step takes ~14s on incremental Bevy builds;
# rust-lld typically cuts that by 30-50%.
#
# Install the component once with: `rustup component add llvm-tools`
#
# rust-lld.exe lives at:
#   ~/.rustup/toolchains/<toolchain>/lib/rustlib/<target>/bin/rust-lld.exe
# which is NOT on the default PATH. We point `linker` at it directly so the
# toolchain location doesn't have to be hard-coded. "-flavor=link" routes
# rust-lld into the MSVC link.exe-compatible driver (rust-lld is multi-driver).
[target.x86_64-pc-windows-msvc]
linker = "C:/Users/Alexander/.rustup/toolchains/stable-x86_64-pc-windows-msvc/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
rustflags = [
    "-C", "link-arg=-flavor=link",
    "-C", "link-arg=/DEBUG:NONE",
]

# Linux: clang+lld. clang is needed so the C runtime headers resolve.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

