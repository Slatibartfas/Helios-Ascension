[package]
name = "helios_ascension"
version = "0.4.0"
edition = "2021"
authors = ["Alexander Klingspor"]
description = "A 4X Grand Strategy game with realistic orbital mechanics"
license = "MIT"

[lib]
name = "helios_ascension"
path = "src/lib.rs"

[[bin]]
name = "helios_ascension"
path = "src/main.rs"

[dependencies]
# Bevy game engine with optimized features.
# Features audited for compile cost on Windows:
# - "x11"/"wayland" dropped: irrelevant on Windows and cost real compile time.
# - "jpeg"/"png" REQUIRED: nearly every celestial-body and UI texture on
#   disk is .jpg or .png (see assets/textures/celestial/**.jpg|.png and
#   assets/data/planet_textures.ron).  Dropping the decoders turns every
#   planet, moon, comet, and ring into an unlit black mesh because
#   `bevy_image` fails the load with "feature \"jpeg\" is not enabled".
#   GRA-368 tracking the regloss.
# - "mp3"/"bevy_audio" retained: `plugins::music` plays MP3s from assets/audio.
bevy = { version = "0.18", features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_audio",
    "bevy_scene",
    "bevy_picking",
    "serialize",
    "mp3",
    "jpeg",
    "png",
] }

bevy_egui = { version = "0.39", features = ["render"] }

# GRA-314 PR-A: persistence layer snapshots the Bevy world via DynamicScene.
# The `bevy_scene` feature on `bevy` activates the plugin + registration, but
# the crate must also be a direct dependency for `use bevy_scene::DynamicScene`
# to resolve. Enabled through the same feature toggle.
bevy_scene = { version = "0.18", features = ["serialize"] }

# Persistence (snapshot.rs) needs to deny-list engine runtime resources
# (AccessibilityRequested, WinitMonitors, etc.) whose inner types are not
# reflect-serialisable. Bevy only re-exports `winit` at the top level; a11y
# must be reached through its standalone crate. Both crates are pulled in
# transitively via the `bevy_winit` feature on `bevy`, but we need a
# direct entry to reference the resource types in the deny call.
bevy_a11y = { version = "0.18", features = ["serialize"] }
bevy_winit = { version = "0.18" }
# Persistence (snapshot.rs) needs to deny-list engine runtime resources
# for the wall-clock / step-clock `Time<T>` family (Time<()>,
# Time<Real>, Time<Virtual>, Time<Fixed>) and TimeUpdateStrategy —
# their inner `Instant`/`Duration` fields don't carry ReflectSerialize
# type data, so the snapshot would otherwise fail with
# "type `Instant` did not register the `ReflectSerialize`".  Bevy
# re-exports them through `bevy::time`, but using the direct crate
# path guarantees we resolve the same `TypeId` the engine inserts
# into the world (vs. an indirect re-export through the prelude).
bevy_time = { version = "0.18" }
# Persistence (snapshot.rs) needs to deny-list the
# `bevy_camera::visibility::VisibilityClass` component — it wraps a
# `SmallVec<[core::any::TypeId; 1]>` whose `TypeId` element is
# process-local and cannot carry `ReflectSerialize` type data. The
# engine re-attaches `VisibilityClass` automatically when entities
# gain renderable components, so omitting it from saves is safe. The
# crate is pulled in transitively via `bevy_render`, but we list it
# directly so the deny call resolves the same `TypeId` the engine
# inserts into the world (vs. an indirect re-export through `bevy::camera`).
bevy_camera = { version = "0.18" }
# Persistence (snapshot.rs) needs to deny-list the `bevy_mesh::Mesh3d`
# and `bevy_pbr::MeshMaterial3d<StandardMaterial>` components — both
# wrap `Handle<T>`, whose `Handle::Strong(Arc<StrongHandle>)` variant
# contains a process-local pointer Bevy can't reflect-serialise
# (`StrongHandle` is opaque and `Arc` of it isn't stable across
# builds). Skipping them in saves breaks visual fidelity on load —
# the save retains gameplay state but loses mesh / material refs.
# Re-attaching visuals on load is a follow-up (see the snapshot.rs
# comment block for the full rationale). Both crates are pulled in
# transitively via `bevy_pbr`/`bevy_render`, but we list them
# directly so the deny call resolves the same `TypeId` the engine
# inserts into the world.
bevy_mesh = { version = "0.18" }
bevy_pbr = { version = "0.18" }

# Math and physics
glam = "0.29"

# Data serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# Random number generation for visual effects
rand = "0.9"
serde_json = "1.0.149"
image = "0.25"

# Window-icon support. Bevy 0.18's `Window` doesn't expose an icon
# field; we set the icon post-creation via
# `winit::window::Window::set_window_icon` from
# `bevy_winit::WINIT_WINDOWS`. The version is pinned to match the
# `winit` version `bevy_winit-0.18` re-exports internally; Cargo's
# resolver guarantees only one copy ends up in the dep graph.
winit = "0.30"

# UUIDs for stable entity identification
uuid = { version = "1.0", features = ["serde", "v4"] }

# Windows taskbar / Alt-Tab icon. The runtime path (winit::Icon::from_rgba)
# only updates the in-memory window icon after the OS has cached the
# executable's resource-section icon, which is what the taskbar uses.
# `winresource` compiles a `winres` manifest + `.ico` link into the
# executable at build time so the taskbar shows the proper logo from the
# moment the user pins the app (or while the splash is up). Skipped on
# non-Windows targets via [target.'cfg(windows)'].
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winresource = "0.1"

[profile.dev]
# Bevy's documented fast-compile guidance is opt-level 0 on the
# crate itself, with optimization applied to dependencies (see the
# [profile.dev.package."*"] block below). Setting opt-level > 0 on
# your own code adds codegen work on every rebuild and cuts the
# fast-iter loop noticeably.
opt-level = 0
# line-tables-only keeps backtraces working but cuts ~40% of .o size vs full
# debug info, which materially reduces link time on Windows MSVC.
debug = "line-tables-only"
# Explicit  keeps Cargo on the incremental
# codegen path (some crate types fall back to non-incremental
# otherwise, which is much slower).
incremental = true

# Dependencies still benefit from full optimization so runtime
# performance matches what we see in release; we just don't pay
# that codegen cost on every edit to our own code.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

# Fast compile profile for local iteration.
#
# Inherits  so we stay on the documented fast-compile path
# rather than paying release-build costs on every iteration. We
# bump codegen units, disable LTO/strip, and force incremental to
# cut codegen and link cost vs. plain dev on Windows MSVC.
[profile.fast]
inherits = "dev"
debug = "line-tables-only"
codegen-units = 256
lto = false
strip = false
incremental = true

# Test profile optimized for fast test compilation and execution.
# Mirrors the dev profile split so test runs don't recompile our
# code with opt-level 1 and drag cargo test timing.
[profile.test]
opt-level = 0
incremental = true

[profile.test.package."*"]
opt-level = 2

[features]
default = []

[lints.clippy]
# Bevy systems inherently use many parameters (queries, resources, events)
too_many_arguments = "allow"
# Bevy Query types are necessarily complex; factoring into aliases adds noise
type_complexity = "allow"
