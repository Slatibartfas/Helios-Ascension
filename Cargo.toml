[package]
name = "helios_ascension"
version = "0.4.0"
edition = "2021"
authors = ["Alexander Klingspor"]
description = "A 4X Grand Strategy game with realistic orbital mechanics"
license = "MIT"

[lib]
name = "helios_ascension"
path = "src/lib.rs"

[[bin]]
name = "helios_ascension"
path = "src/main.rs"

[dependencies]
# Bevy game engine with optimized features
bevy = { version = "0.18", features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_audio",
    "bevy_scene",
    "serialize",
    "mp3",
    "x11",
    "wayland",
    "jpeg",
    "png",
] }

# Debug and development tools
bevy-inspector-egui = "0.36"
bevy_egui = { version = "0.39", features = ["render"] }

# GRA-314 PR-A: persistence layer snapshots the Bevy world via DynamicScene.
# The `bevy_scene` feature on `bevy` activates the plugin + registration, but
# the crate must also be a direct dependency for `use bevy_scene::DynamicScene`
# to resolve. Enabled through the same feature toggle.
bevy_scene = { version = "0.18", features = ["serialize"] }

# Persistence (snapshot.rs) needs to deny-list engine runtime resources
# (AccessibilityRequested, WinitMonitors, etc.) whose inner types are not
# reflect-serialisable. Bevy only re-exports `winit` at the top level; a11y
# must be reached through its standalone crate. Both crates are pulled in
# transitively via the `bevy_winit` feature on `bevy`, but we need a
# direct entry to reference the resource types in the deny call.
bevy_a11y = { version = "0.18", features = ["serialize"] }
bevy_winit = { version = "0.18" }
# Persistence (snapshot.rs) needs to deny-list engine runtime resources
# for the wall-clock / step-clock `Time<T>` family (Time<()>,
# Time<Real>, Time<Virtual>, Time<Fixed>) and TimeUpdateStrategy —
# their inner `Instant`/`Duration` fields don't carry ReflectSerialize
# type data, so the snapshot would otherwise fail with
# "type `Instant` did not register the `ReflectSerialize`".  Bevy
# re-exports them through `bevy::time`, but using the direct crate
# path guarantees we resolve the same `TypeId` the engine inserts
# into the world (vs. an indirect re-export through the prelude).
bevy_time = { version = "0.18" }

# Math and physics
glam = "0.29"

# Data serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# Random number generation for visual effects
rand = "0.9"
serde_json = "1.0.149"
image = "0.25"

# UUIDs for stable entity identification
uuid = { version = "1.0", features = ["serde", "v4"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

# Fast compile profile for development
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Test profile optimized for fast test compilation and execution
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2

[features]
default = []

[lints.clippy]
# Bevy systems inherently use many parameters (queries, resources, events)
too_many_arguments = "allow"
# Bevy Query types are necessarily complex; factoring into aliases adds noise
type_complexity = "allow"
