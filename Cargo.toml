[package]
name = "helios_ascension"
version = "0.4.0"
edition = "2021"
authors = ["Alexander Klingspor"]
description = "A 4X Grand Strategy game with realistic orbital mechanics"
license = "MIT"

[lib]
name = "helios_ascension"
path = "src/lib.rs"

[[bin]]
name = "helios_ascension"
path = "src/main.rs"

[dependencies]
# Bevy game engine with optimized features
bevy = { version = "0.18", features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_winit",
    "bevy_text",
    "bevy_ui",
    "bevy_audio",
    "bevy_scene",
    "serialize",
    "mp3",
    "x11",
    "wayland",
    "jpeg",
    "png",
] }

# Debug and development tools
bevy-inspector-egui = "0.36"
bevy_egui = { version = "0.39", features = ["render"] }

# Math and physics
glam = "0.29"

# Data serialization
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

# Random number generation for visual effects
rand = "0.9"
serde_json = "1.0.149"
image = "0.25"

# UUIDs for stable entity identification
uuid = { version = "1.0", features = ["serde", "v4"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true

# Fast compile profile for development
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Test profile optimized for fast test compilation and execution
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2

[features]
default = []

[lints.clippy]
# Bevy systems inherently use many parameters (queries, resources, events)
too_many_arguments = "allow"
# Bevy Query types are necessarily complex; factoring into aliases adds noise
type_complexity = "allow"
