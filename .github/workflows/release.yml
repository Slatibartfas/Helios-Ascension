name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --pretty=format:'%h - %s' --reverse ${{ github.event.repository.default_branch }}..HEAD)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Helios Ascension ${{ github.ref }}
          body: |
            ## What's New

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Download

            Download the binary for your platform below.
          draft: false
          prerelease: false

  build-release:
    name: Build (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: helios_ascension_linux_x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            artifact_name: helios_ascension_macos
            target: x86_64-apple-darwin
          - os: windows-latest
            artifact_name: helios_ascension_windows_x86_64.exe
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Prepare binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/helios_ascension.exe ${{ matrix.artifact_name }}
          else
            cp target/release/helios_ascension ${{ matrix.artifact_name }}
            chmod +x ${{ matrix.artifact_name }}
          fi

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream

  build-assets:
    name: Build Platform Assets
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
            artifact_prefix: helios_ascension_linux_arm64
          - os: macos-latest
            targets: aarch64-apple-darwin
            artifact_prefix: helios_ascension_macos_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Build release
        run: |
          for target in $(echo ${{ matrix.targets }} | tr ',' ' '); do
            cargo build --release --locked --target $target
          done
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Upload Release Assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for target in $(echo ${{ matrix.targets }} | tr ',' ' '); do
            binary_name="${{ matrix.artifact_prefix }}"
            cp "target/$target/release/helios_ascension" "$binary_name"
            chmod +x "$binary_name"
            gh release upload ${{ github.ref_name }} "$binary_name" --clobber
          done

  publish-itchio:
    name: Publish to itch.io
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: helios-ascension-ubuntu-latest
          path: build/linux

      - name: Download Windows build
        run: |
          mkdir -p build/windows
          gh release download ${{ github.ref_name }} --pattern 'helios_ascension_windows_x86_64.exe' --dir build/windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS build
        run: |
          mkdir -p build/macos
          gh release download ${{ github.ref_name }} --pattern 'helios_ascension_macos' --dir build/macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up butler
        uses: moia-dev/setup-butler@v1
        with:
          version: '5'

      - name: Push to itch.io
        run: |
          butler push build/linux "${{ secrets.ITCHIO_GAME_SLUG }}" --fs=helios_ascension_linux_x86_64
          butler push build/windows "${{ secrets.ITCHIO_GAME_SLUG }}" --fs=helios_ascension_windows_x86_64.exe
          butler push build/macos "${{ secrets.ITCHIO_GAME_SLUG }}" --fs=helios_ascension_macos
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
