name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies (Bevy 0.18)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libwayland-dev pkg-config libxkbcommon-dev liblzma-dev libssl-dev

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        # GRA-53 / PR-#112 follow-up: cap cargo at 2 parallel jobs to
        # reduce peak memory. The `ubuntu-latest` runner SIGTERMs
        # `cargo test --all` mid-compile at ~4–4:25 min (exit 143,
        # variable by runner instance) — most likely OOM on a 7 GB
        # runner pulling the workspace's Bevy 0.18 test binary
        # through the link. Capping at 2 jobs cuts peak memory by
        # ~half; the compile is ~2× slower (~10 min) but well under
        # the 30-min job timeout. See GRA-61 follow-up for the
        # long-term fix (self-hosted runner, sccache, or split test
        # binary).
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --all

      - name: cargo doc
        run: cargo doc --no-deps

      - name: Audit B0001 query patterns
        run: |
          # Print (not gate) candidate B0001 query conflicts. See
          # scripts/audit_b0001.py and CLAUDE.md. Set --strict to make
          # this fail the build on any 'risk' candidates.
          python3 scripts/audit_b0001.py src
