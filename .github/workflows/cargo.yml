name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies (Bevy 0.18)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libwayland-dev pkg-config libxkbcommon-dev liblzma-dev libssl-dev

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.4

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all
        env:
          RUSTC_WRAPPER: sccache

      - name: cargo doc
        run: cargo doc --no-deps

      - name: Audit B0001 query patterns
        run: |
          # Print (not gate) candidate B0001 query conflicts. See
          # scripts/audit_b0001.py and CLAUDE.md. Set --strict to make
          # this fail the build on any 'risk' candidates.
          python3 scripts/audit_b0001.py src
