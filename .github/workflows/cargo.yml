name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  # sccache wrapper (GRA-380). With `.cargo/config.toml` setting
  # `rustc-wrapper = "sccache"`, every cargo invocation is wrapped.
  # SCCACHE_DIR points sccache at a local-disk cache inside the
  # runner's workspace, which lets a single cargo invocation share
  # object files across multiple rustc processes within the same
  # run (saves wall time on `cargo test` after `cargo clippy`).
  # Cross-run reuse is handled by Swatinem/rust-cache above, which
  # caches the entire target/ directory keyed by Cargo.lock — that
  # covers the common case (95%+ of CI wall time) more cheaply than
  # sccache's GHA backend. We deliberately do NOT enable
  # SCCACHE_GHA_ENABLED here: that backend requires ACTIONS_CACHE_URL
  # at server-startup time, which isn't reliably exposed in every
  # step environment, and the marginal gain over Swatinem/rust-cache
  # isn't worth the failure mode.
  SCCACHE_DIR: "/home/runner/.sccache-cache"
  SCCACHE_CACHE_SIZE: "2G"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies (Bevy 0.18)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libwayland-dev pkg-config libxkbcommon-dev liblzma-dev libssl-dev

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .

      - name: Install sccache
        # Local-disk sccache wrapper for in-run rustc deduplication.
        # `.cargo/config.toml` sets `rustc-wrapper = "sccache"`, so
        # cargo invocations are wrapped automatically once sccache
        # is on $PATH. Cross-run reuse is handled by Swatinem/rust-cache
        # above (target/ caching), not by sccache.
        run: cargo install sccache --locked --version ^0.16

      - name: Start sccache server
        # sccache uses a client-server model: the rustc-wrapper is a
        # thin client that connects to a background server. We start
        # the server explicitly so the cargo invocations below just
        # connect to a running server rather than trying to spin one
        # up inside the wrapper invocation context. SCCACHE_DIR in
        # the workflow-level env: block points the local-disk backend
        # at a per-workspace cache directory.
        run: |
          sccache --version
          sccache --start-server
          sccache -z

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        # GRA-165: cargo test --all is currently non-authoritative.
        # The workspace-wide cargo test target (bevy 0.18 + bevy_egui
        # + ~280 transitive crates) hits the `ubuntu-latest` runner
        # SIGTERM cliff at exit 143 during `Compiling helios_ascension`
        # for the test target — the workspace itself fits the ~7 GB
        # ram disk but the test target never finishes within the
        # 30m `timeout-minutes` ceiling.  `cargo clippy --all-targets
        # --all-features -- -D warnings` compiles the same crate
        # graph in ~14s and fires on real type/lint regressions, which
        # is the gate we now trust.
        # GRA-191: bumped `timeout-minutes: 30 → 60` and added
        # `CARGO_BUILD_JOBS: "2"` so the cargo-test final-link step
        # has headroom on the free `ubuntu-latest` runner (see
        # [[cargo-test-30-min-runner-timeout]]).
        # The two audit scripts (`audit_b0001.py`,
        # `audit_color32_literals.py`) + the Kilo Code Review check
        # cover the high-value test-target use cases (Bevy render-stack
        # unit tests dropped per [[feedback-egui-render-tests]];
        # integration tests for state-mutation guards use resource
        # roundtrips per [[feedback-bevy-018-tests-app-not-schedule]]).
        # Operator decision `b5b3b93c-5d07-42d1-a025-9479cd5c105f`
        # (option A: clippy-only gate) approved 2026-07-01 06:56Z.
        # When the SIGTERM cliff hits, `continue-on-error: true` keeps
        # the job green so merge is gated on cargo fmt + clippy +
        # ui-lint + Kilo Code Review.
        continue-on-error: true
        run: cargo test --all

      - name: cargo doc
        continue-on-error: true
        run: cargo doc --no-deps

      - name: Audit B0001 query patterns
        run: |
          # Print (not gate) candidate B0001 query conflicts. See
          # scripts/audit_b0001.py and CLAUDE.md. Set --strict to make
          # this fail the build on any 'risk' candidates.
          python3 scripts/audit_b0001.py src

  ui-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit hardcoded Color32 literals
        run: |
          # Fails the build on any new hardcoded `Color32::from_*` call
          # outside src/ui/theme.rs. Known violations are listed in
          # scripts/audit_color32_literals_baseline.txt and tolerated;
          # see docs/UI.md "Contribution Rules" for the rationale and
          # the workflow for promoting them into theme.rs constants.
          python3 scripts/audit_color32_literals.py --strict \
            --baseline scripts/audit_color32_literals_baseline.txt src

      - name: Audit hardcoded Bevy Color literals
        run: |
          # GRA-67 (PR-B) extends the colour-token audit to the Bevy UI
          # 0.18 side. Same model as the egui audit: theme.rs is the
          # only authorised home for raw colour literals; everything
          # else either uses a `theme::Color::*` constant or appears
          # in scripts/audit_bevy_color_literals_baseline.txt.
          # Non-blocking while PR-D migrates shipbuilding_workspace.rs.
          python3 scripts/audit_bevy_color_literals.py --strict \
            --baseline scripts/audit_bevy_color_literals_baseline.txt src
